<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Bungee&family=Caveat:wght@700&family=Comic+Neue:wght@700&family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@400;600;700&family=Permanent+Marker&family=Poppins:wght@400;600;700;800;900&family=Righteous&family=Rubik:wght@400;600;700;800;900&family=Titan+One&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
:root{--scene-bg:#00ff00;--ui-bg:rgba(17,19,25,.95);--ui-bg2:rgba(255,255,255,.05);--ui-fg:#e8ebf2;--ui-mut:#8a92a6;--ui-acc:#ffd23f;--ui-line:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--scene-bg)}
body{font:12.5px/1.35 Inter,system-ui,sans-serif;color:var(--ui-fg)}
body.rec,body.rec *{cursor:none!important}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--scene-bg)}
#gl{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
#overlay{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;overflow:visible}
#dropHint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#dropHint div{font:600 34px Inter,sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:28px 44px;border-radius:18px;border:3px dashed rgba(255,255,255,.7)}
body.noimg #dropHint{display:flex}
body.dragging #dropHint{display:flex}

/* ---------- subtitle text ---------- */
#textBox{position:absolute;pointer-events:none;transform-origin:50% 50%}
#textInner{width:100%;height:100%;display:flex;flex-direction:column}
#textBlock{max-width:100%;font-family:var(--font);font-weight:var(--weight);font-size:var(--fs);color:var(--color);line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);text-transform:var(--tt);text-align:var(--align);-webkit-text-stroke:var(--stroke) var(--strokeColor);paint-order:stroke fill;text-shadow:var(--shadow);overflow-wrap:break-word}
#textBlock.boxbg{background:var(--bg);padding:var(--pad) calc(var(--pad)*1.4);border-radius:var(--radius)}
.w{display:inline-block;white-space:nowrap;perspective:600px}
.w.clip{overflow:hidden;padding:0 .12em .08em;margin:0 -.12em -.08em;vertical-align:bottom}
.wi{display:inline-block;transform-origin:50% 60%;will-change:transform,opacity;transition:color .08s,background-color .08s}
.padwords .wi{padding:.02em .16em;margin:0 -.06em;border-radius:var(--radius)}
.pills .wi{background:var(--bg)}
.c{display:inline-block;white-space:pre;transform-origin:50% 70%;will-change:transform,opacity}
.fi{font-style:italic}
.fb{font-weight:900}
.fu{text-decoration:underline;text-decoration-thickness:.09em;text-underline-offset:.12em}
.wi.kw{position:relative}
.kov{position:absolute;left:0;top:0;right:0;bottom:0;white-space:nowrap;pointer-events:none}
.padwords .kov{padding:inherit}
.caret{display:inline-block;width:0;position:relative}
.caret::after{content:"";position:absolute;left:.04em;bottom:.12em;width:.08em;height:.9em;background:var(--hl);animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- overlay ---------- */
#overlay .ob{fill:rgba(255,210,63,.04);stroke:#ffd23f;stroke-width:1.5;stroke-dasharray:7 6;vector-effect:non-scaling-stroke}
#overlay .oc.hov,#overlay .ob.hov{stroke-dasharray:none;stroke-width:2}
#overlay .oc{fill:none;stroke:#fff;stroke-width:1.5;stroke-dasharray:7 6;vector-effect:non-scaling-stroke;opacity:.8}
#overlay .hd{fill:#fff;stroke:#111;stroke-width:1.2;vector-effect:non-scaling-stroke}
#overlay .hdy{fill:#ffd23f;stroke:#111;stroke-width:1.2;vector-effect:non-scaling-stroke}
#overlay .ol{fill:#fff;stroke:#000;stroke-width:3px;paint-order:stroke;font-family:Inter,sans-serif;font-weight:700}
#overlay .ln{stroke-width:2;vector-effect:non-scaling-stroke;fill:none}
#overlay .lnd{stroke-width:1.5;stroke-dasharray:5 5;vector-effect:non-scaling-stroke;fill:none}
#overlay .pt{stroke:#111;stroke-width:1.5;vector-effect:non-scaling-stroke}

/* ---------- panel ---------- */
#panel{position:fixed;top:12px;right:12px;width:384px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(10px);z-index:10}
body:not(.edit) #panel,body:not(.edit) #toast{display:none}
#panelHead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ui-line)}
#panelHead b{font-size:14px;letter-spacing:.2px}
#panelHead .st{margin-left:auto;color:var(--ui-mut);font-size:11.5px;text-align:right}
#panelBody{overflow-y:auto;padding:4px 0 10px;scrollbar-width:thin}
details{border-bottom:1px solid var(--ui-line)}
summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:12.5px;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--ui-mut);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
.sec{padding:0 14px 12px}
.row{display:grid;grid-template-columns:44% 1fr;align-items:center;gap:8px;min-height:28px}
.row>label{color:var(--ui-mut)}
.row.chk{grid-template-columns:1fr auto}
.rw{display:flex;align-items:center;gap:8px}
.rw input[type=range]{flex:1;min-width:0;accent-color:var(--ui-acc)}
.val{width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ui-fg);font-size:11.5px}
select,input[type=number],input[type=text]{width:100%;background:#0c0e13;color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:7px;padding:5px 7px;font:inherit}
input[type=color]{width:100%;height:26px;border:1px solid var(--ui-line);border-radius:7px;background:#0c0e13;padding:2px}
input[type=checkbox]{accent-color:var(--ui-acc);width:16px;height:16px}
button{background:rgba(255,255,255,.08);color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:8px;padding:6px 10px;font:600 12px Inter,sans-serif;cursor:pointer}
button:hover{background:rgba(255,255,255,.14)}
button.pri{background:var(--ui-acc);color:#16130a;border-color:transparent}
button.pri:hover{filter:brightness(1.08)}
button.on{outline:2px solid var(--ui-acc)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.note{color:var(--ui-mut);font-size:11.5px;margin:4px 0 8px;line-height:1.45}
.note kbd,.keys kbd{background:#0c0e13;border:1px solid var(--ui-line);border-radius:4px;padding:0 5px;font:600 11px ui-monospace,monospace;color:var(--ui-fg)}
.tb{display:flex;gap:4px;margin-bottom:6px;align-items:center}
.tb button{width:30px;padding:4px 0}
.tb .hint{color:var(--ui-mut);font-size:11px;margin-left:6px}
#editor{min-height:110px;max-height:220px;overflow:auto;background:#0c0e13;border:1px solid var(--ui-line);border-radius:8px;padding:8px 10px;outline:none;font:14px/1.5 Inter,sans-serif;color:#fff}
#editor:focus{border-color:rgba(255,210,63,.6)}
#editor div{margin-bottom:6px}
#editor i,#editor em{color:#8fd3ff}
#editor b,#editor strong{color:#ffd23f}
#editor u{text-decoration-color:#ff6b6b;text-decoration-thickness:2px}
#takes{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.take{display:grid;grid-template-columns:18px 1fr 52px 66px 8px;gap:6px;align-items:center;padding:5px 7px;border-radius:8px;background:var(--ui-bg2);cursor:pointer;border:1px solid transparent}
.take.on{border-color:var(--ui-acc)}
.take .tn{font-weight:800;color:var(--ui-acc);text-align:center}
.take .tp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cfd4df}
.take input{padding:3px 5px;font-size:11.5px}
.take select{padding:3px 2px;font-size:11.5px}
.take .ts{color:var(--ui-mut)}
.ptrow{display:grid;grid-template-columns:12px 1fr auto auto;gap:7px;align-items:center;min-height:30px}
.ptrow .dot{width:11px;height:11px;border-radius:50%;border:1px solid #111}
.ptrow .nm{color:var(--ui-fg)}
.ptrow .nm small{color:var(--ui-mut);display:block;font-size:10.5px}
.ptrow button{padding:4px 8px}
#poseBar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--ui-line)}
#poseBar .pb{flex:1;display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:9px;background:var(--ui-bg2);border:1px solid transparent;cursor:pointer;font-weight:700;min-width:0}
#poseBar .pb:hover{background:rgba(255,255,255,.09)}
#poseBar .pb.on{border-color:var(--ui-acc);background:rgba(255,210,63,.1)}
#poseBar .th{width:30px;height:30px;border-radius:6px;background:#0c0e13 center/contain no-repeat;flex:none;border:1px solid var(--ui-line)}
#poseBar small{display:block;font-weight:500;color:var(--ui-mut);font-size:10.5px}
#poseBar kbd{font:600 10px ui-monospace,monospace;color:var(--ui-mut);margin-left:auto}
#panelFoot{padding:8px 14px 10px;border-top:1px solid var(--ui-line);color:var(--ui-mut);font-size:11px;display:flex;flex-wrap:wrap;gap:5px 12px}
#panelFoot kbd{background:#0c0e13;border:1px solid var(--ui-line);border-radius:4px;padding:0 4px;font:600 10.5px ui-monospace,monospace;color:var(--ui-fg)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111;color:#fff;border:1px solid rgba(255,210,63,.5);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.4);transition:opacity .2s;max-width:min(680px,90vw)}
#toast.hide{opacity:0;pointer-events:none}
#toast button{padding:4px 9px}
</style>
</head>
<body class="edit">
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="textBox"><div id="textInner"><div id="textBlock"></div></div></div>
  <svg id="overlay" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="dropHint"><div>Drop a transparent PNG here, or click to choose</div></div>
</div>

<div id="panel">
  <div id="panelHead"><b>Pose</b><div class="st" id="status"></div></div>
  <div id="poseBar"></div>
  <div id="panelBody"></div>
  <div id="panelFoot"><span><kbd>S</kbd> panel</span><span><kbd>R</kbd> replay take</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> pose</span><span><kbd>←</kbd><kbd>→</kbd> take</span><span><kbd>F</kbd> fullscreen</span><span>Wheel on character = resize</span></div>
</div>
<div id="toast" class="hide"><span id="toastMsg"></span><span id="toastBtns" style="display:flex;gap:6px"></span></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   Basics
   ===================================================================== */
const W = 1920, H = 1080;
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const hash = (a, b = 0) => { const x = Math.sin(a * 127.1 + b * 311.7 + 0.123) * 43758.5453; return x - Math.floor(x); };
const clone = o => JSON.parse(JSON.stringify(o));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function merge(base, over) {
  for (const k in over) {
    const v = over[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], v);
    else if (v !== undefined) base[k] = v;
  }
  return base;
}
const getK = (o, k) => k.split('.').reduce((a, p) => (a == null ? a : a[p]), o);
function setK(o, k, v) { const ps = k.split('.'); let a = o; for (let i = 0; i < ps.length - 1; i++) a = a[ps[i]]; a[ps[ps.length - 1]] = v; }
const hexToV3 = (hex, v = new THREE.Vector3()) => { const n = parseInt(hex.replace('#', ''), 16); return v.set(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
const hexToRgba = (hex, a) => { const n = parseInt(hex.replace('#', ''), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const lum = hex => { const v = hexToV3(hex); return 0.2126 * v.x + 0.7152 * v.y + 0.0722 * v.z; };

const E = {
  oc: p => 1 - Math.pow(1 - p, 3),
  ob: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  oe: p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * 2.0944) + 1,
  bounce: p => { const n1 = 7.5625, d1 = 2.75; if (p < 1 / d1) return n1 * p * p; if (p < 2 / d1) return n1 * (p -= 1.5 / d1) * p + 0.75; if (p < 2.5 / d1) return n1 * (p -= 2.25 / d1) * p + 0.9375; return n1 * (p -= 2.625 / d1) * p + 0.984375; },
  ib: p => { const c1 = 1.70158, c3 = c1 + 1; return c3 * p * p * p - c1 * p * p; },
};

/* =====================================================================
   Settings
   ===================================================================== */
const DEFAULT_SCRIPT = '<div>Okay so I <i>finally</i> tried the new coffee place downtown, and honestly? The latte art was a <b>literal masterpiece</b>.</div><div>Then they told me the PRICE. <u>Twelve dollars.</u> For one coffee!</div><div>Ten out of ten. | Would <i>absolutely</i> go broke there again.</div>';
const DEMO_PTS = { eye1: { u: 282 / 700, v: 365 / 900 }, eye2: { u: 420 / 700, v: 365 / 900 }, m1: { u: 168 / 700, v: 470 / 900 }, m2: { u: 436 / 700, v: 478 / 900 }, neck: { u: 0.5, v: 600 / 900 }, fx: null };
function newPose() {
  return {
    img: null, // 'demo' | 'idb' | null
    char: { x: 80, y: 180, h: 900, mirror: false, facing: 'right' },
    pts: { eye1: null, eye2: null, m1: null, m2: null, neck: null, fx: null },
    eyes: { size: 0.045, aspect: 1.15 },
    head: { maxAngle: 22, lift: 30, hinge: 'random', nod: 3, sway: 2, idleSway: 3, idleSpeed: 1, neckBand: 0.06 },
    brows: { on: true, style: 'blade', size: 1, thick: 1, angle: 24, gap: 1.55, color: '#1c1410', outline: true, tremble: true },
  };
}
function demoPose() { const p = newPose(); p.img = 'demo'; p.char = { x: 90, y: 260, h: 820, mirror: false, facing: 'right' }; p.pts = clone(DEMO_PTS); p.eyes = { size: 0.047, aspect: 0.95 }; return p; }
const DEFAULTS = {
  v: 3, pose: 0, poses: [demoPose(), newPose(), newPose()],
  border: { on: true, w: 5, color: '#ffffff' },
  scene: { bg: 'green', custom: '#00ff00', preDelay: 500, entry: 'pop', entryDur: 650, textDelay: 250, hideText: false, hideAfter: 2, exit: 'fade', exitDur: 450, exitChar: false, hideCursor: true },
  talk: { flapsPerSyl: 1, snap: 0.65, randomness: 0.35, wiggle: 'auto', wiggleAngle: 3.5, wiggleSquash: 0.045, bodyBounce: 0.3, punct: true, breathing: true, blinking: true, blinkEvery: 3.5 },
  fx: { winkEye: 'auto', lash: true, lashColor: '#1b1b1b', winkSparkle: true, bulge: 1.6, bulgeWobble: true, wide: 0.6, shock: true, shockSize: 120, shockColor: '#e8202a', hop: true, hopPx: 30, shockLines: false, linesColor: 'auto', sweat: false, punch: false, punchAmt: 0.07, angrySquint: 0.3, angryTint: 0.35, angryShake: true, response: 16, release: 250 },
  text: { anim: 'pop', enterDur: 320, sync: 0, mode: 'chunk', chunk: 4, caret: true, highlight: 'color', hlColor: '#ffe53b', format: true, autoFit: true, loop: 'wobble', loopAmt: 0.5, loopSpeed: 1 },
  style: { font: 'Montserrat', weight: 900, size: 76, upper: false, color: '#ffffff', stroke: 7, strokeColor: '#000000', shadow: 'none', bg: 'none', bgColor: '#000000', bgOpacity: 0.75, pad: 16, radius: 14, align: 'center', valign: 'center', lineHeight: 1.12, letter: 0, wordGap: 0.12 },
  box: { x: 90, y: 690, w: 1050, h: 300 },
  script: { html: DEFAULT_SCRIPT, durations: [], poses: [], current: 0, wpm: 165, pipeMs: 450 },
};
const POSE_KEYS = ['char', 'pts', 'eyes', 'head', 'brows'];
// S.char / S.pts / S.eyes / S.head / S.brows always point at the active pose
function bindPose(o) { for (const k of POSE_KEYS) Object.defineProperty(o, k, { get() { return o.poses[o.pose][k]; }, configurable: true, enumerable: false }); return o; }
function normalize(saved) {
  let s = clone(DEFAULTS);
  const oldV = saved ? (saved.v || 1) : 3;
  if (saved) {
    saved = clone(saved);
    if (saved.scene && saved.scene.hideText === undefined) {
      saved.scene.hideText = !!(saved.scene.exit && saved.scene.exit !== 'none');
      saved.scene.hideAfter = (saved.scene.hold ?? 2000) / 1000;
      if (!saved.scene.exit || saved.scene.exit === 'none') saved.scene.exit = 'fade';
      delete saved.scene.hold;
    }
    if (!saved.poses) { // migrate the single-character format
      const p0 = demoPose();
      if (saved.char) {
        p0.char = { x: saved.char.x ?? 90, y: saved.char.y ?? 260, h: saved.char.h ?? 820, mirror: !!saved.char.mirror, facing: saved.char.facing || 'right' };
        p0.img = saved.char.demo === false ? 'idb' : 'demo';
        if (saved.char.border !== undefined) saved.border = { on: saved.char.border, w: saved.char.borderW ?? 5, color: saved.char.borderColor || '#ffffff' };
      }
      if (saved.pts) p0.pts = merge(newPose().pts, saved.pts);
      if (saved.eyes) merge(p0.eyes, saved.eyes);
      if (saved.talk) for (const k of Object.keys(p0.head)) if (saved.talk[k] !== undefined) p0.head[k] = saved.talk[k];
      saved.poses = [p0, newPose(), newPose()]; saved.pose = 0;
      delete saved.char; delete saved.pts; delete saved.eyes;
    }
    const poses = saved.poses; delete saved.poses;
    s = merge(s, saved);
    s.poses = [0, 1, 2].map(i => merge(newPose(), poses[i] || {}));
    if (oldV < 3) { // new defaults: random head motion, bigger fish-eye scale
      for (const p of s.poses) { delete p.pts.brow1; delete p.pts.brow2; if (p.head.hinge === 'auto') p.head.hinge = 'random'; p.head.lift = Math.max(p.head.lift, 30); }
      s.fx.bulge = 1.6;
    }
  }
  s.v = 3;
  s.pose = clamp(s.pose | 0, 0, 2);
  return bindPose(s);
}
const LS_SETTINGS = 'talkinghead.settings.v1';
let S;
try { S = normalize(JSON.parse(localStorage.getItem(LS_SETTINGS) || 'null')); } catch (e) { S = normalize(null); }
let saveT = 0;
function saveNow() { try { localStorage.setItem(LS_SETTINGS, JSON.stringify(S)); } catch (e) { console.warn('save failed', e); } }
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(saveNow, 250); }

/* IndexedDB key/value for images (too large for localStorage) */
const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => { const r = indexedDB.open('talking-head', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return this.db;
  },
  async get(k) { try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return null; } },
  async set(k, v) { try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { console.warn(e); } },
  async del(k) { try { const db = await this.open(); await new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) { } },
};

/* =====================================================================
   three.js scene
   ===================================================================== */
const stageEl = $('#stage');
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true, alpha: true, premultipliedAlpha: true });
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, -100, 100);
cam.position.set(W / 2, H / 2, 10);

const VERT = `
attribute vec2 aP; varying vec2 vP;
void main(){ vP = aP; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const FRAG = `
precision highp float;
uniform sampler2D uTex; uniform sampler2D uSdf;
uniform vec2 uSize; uniform float uMirror; uniform float uScale; uniform float uAlpha;
uniform float uNeckOn; uniform vec2 uNeck; uniform float uNeckAng; uniform vec2 uNeckOff; uniform float uNeckBand;

    const data = JSON.parse(await f.text());
    let settings, images;
    if (data.format === 'talking-head-backup') { settings = data.settings; images = data.images || []; }
    else if (data.format === 'talking-head-preset') { settings = data.settings; settings.char = { ...(settings.char || {}), demo: data.image === 'demo' }; images = [data.image !== 'demo' ? data.image : null]; }
    else throw new Error('unknown file');
    const keep = S.script; S = normalize(settings); S.script = keep;
    for (let i = 0; i < 3; i++) { if (images[i]) { await IDB.set('pose:' + i, images[i]); S.poses[i].img = 'idb'; } }
    await reloadAll(); toast('Backup imported.', [], 1800);
  } catch (e) { console.warn(e); toast('That file is not a Pose backup.', [], 2500); }
}

/* =====================================================================
   Misc: background, keys, fullscreen
   ===================================================================== */
function applyBg() {
  const c = S.scene.bg === 'black' ? '#000000' : S.scene.bg === 'custom' ? S.scene.custom : '#00ff00';
  document.documentElement.style.setProperty('--scene-bg', c);
}
function toggleFullscreen() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => { }); }
function setEdit(on) {
  EDIT = on; document.body.classList.toggle('edit', on);
  document.body.classList.toggle('rec', !on && S.scene.hideCursor);
  if (!on) { ARMED = null; GUIDED = null; hideToast(); stageEl.style.cursor = ''; }
  drawOverlay();
}
addEventListener('keydown', e => {
  const tg = e.target, typing = tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName));
  if ((e.ctrlKey || e.metaKey) && !typing && ['b', 'i', 'u'].includes(e.key.toLowerCase())) { e.preventDefault(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 's') { setEdit(!EDIT); e.preventDefault(); }
  else if (k === 'r') { play(); e.preventDefault(); }
  else if (k === 'f') toggleFullscreen();
  else if (k === '1' || k === '2' || k === '3') selectPose(+k - 1);
  else if (k === 'arrowright' || k === 'n') selectTake(S.script.current + 1);
  else if (k === 'arrowleft' || k === 'p') selectTake(S.script.current - 1);
  else if (k === 'escape') { ARMED = null; GUIDED = null; hideToast(); }
});
addEventListener('resize', fitStage);

/* =====================================================================
   Main loop & boot
   ===================================================================== */
let lastNow = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
  if (window.__freezeE != null && PLAY.on) PLAY.t0 = now - window.__freezeE; // debug: hold playback at a fixed moment
  const P = phaseInfo(now); lastTm = P.tm;
  try { updateChar(now, dt, P); updateTextFrame(now, dt, P); } catch (err) { console.error(err); }
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
window.__TH = { S: () => S, play, TL, PLAY, setEdit, selectTake, selectPose, preview, rebuildText, refreshUI, renderPointsUI };

(async function boot() {
  applyBg();
  buildPanel(); refreshUI(); renderPointsUI(); renderPoseBar();
  TAKES = parseTakes(editorEl); renderTakes();
  fitStage();
  for (let i = 0; i < 3; i++) await loadPoseImage(i);
  applyPoseImage(); renderPoseBar(); saveNow();
  rebuildText();
  if (document.fonts) { document.fonts.ready.then(rebuildText); document.fonts.addEventListener('loadingdone', rebuildTextSoon); }
  requestAnimationFrame(frame);
})();
</script>
