<!doctype html>
<html lang="en">

        <title>AI Training Data</title>

        <style>
            :root {
                --page: #0d0d0d;
                --surface: #1a1a19;
                --sunk: #141413;
                --ink: #f0efec;
                --ink2: #c3c2b7;
                --muted: #898781;
                --grid: #2c2c2a;
                --axis: #383835;
                --border: #2c2c2a;
                --exp: #d95926;
                --scurve: #199e70;
                --link: #6da7ec;
                --focus: #3987e5;
                --ev-hypothesis: #184f95;
                --ev-assumption: #256abf;
                --ev-alleged: #3987e5;
                --ev-reported: #6da7ec;
                --ev-confirmed: #9ec5f4;
            }
            * {
                box-sizing: border-box;
            }
            html {
                -webkit-text-size-adjust: 100%;
                color-scheme: dark;
            }
            body {
                margin: 0;
                background: var(--page);
                color: var(--ink);
                font:
                    15px/1.55 system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    "Helvetica Neue",
                    sans-serif;
                font-variant-numeric: tabular-nums;
            }
            a {
                color: var(--link);
                text-underline-offset: 2px;
            }
            .wrap {
                max-width: 1200px;
                margin: 0 auto;
                padding: 0 16px;
            }
            h1 {
                font-size: clamp(30px, 5.2vw, 52px);
                line-height: 1.05;
                margin: 40px 0 24px;
                letter-spacing: -0.02em;
                font-weight: 750;
            }
            h1 .e {
                color: var(--exp);
            }
            h1 .s {
                color: var(--scurve);
            }
            h2 {
                font-size: 22px;
                line-height: 1.2;
                margin: 0 0 6px;
                letter-spacing: -0.01em;
            }
            .sub {
                color: var(--ink2);
                margin: 0 0 16px;
                max-width: 800px;
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 20px;
                margin: 0 0 40px;
            }
            .chip {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                border: 1px solid var(--border);
                background: var(--surface);
                color: var(--ink);
                border-radius: 999px;
                padding: 4px 10px;
                font: inherit;
                font-size: 13px;
                cursor: pointer;
            }
            .chip[aria-pressed="false"] {
                color: var(--muted);
                background: transparent;
                text-decoration: line-through;
                text-decoration-color: var(--axis);
            }
            .chip[aria-pressed="false"] .sw {
                opacity: 0.3;
            }
            .sw {
                width: 10px;
                height: 10px;
                border-radius: 3px;
                display: inline-block;
                flex: none;
            }
            .btn {
                border: 1px solid var(--border);
                background: var(--surface);
                color: var(--ink);
                border-radius: 9px;
                padding: 6px 12px;
                font: inherit;
                font-size: 13px;
                cursor: pointer;
            }
            .btn:hover {
                border-color: var(--axis);
            }
            button:focus-visible,
            input:focus-visible,
            select:focus-visible,
            a:focus-visible,
            [tabindex]:focus-visible {
                outline: 2px solid var(--focus);
                outline-offset: 2px;
            }
            select,
            input[type="search"] {
                font: inherit;
                font-size: 13.5px;
                color: var(--ink);
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 9px;
                padding: 6px 9px;
                max-width: 100%;
            }
            .badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                font-size: 12px;
                font-weight: 600;
                border: 1px solid var(--border);
                border-radius: 999px;
                padding: 1px 8px 1px 6px;
                white-space: nowrap;
                background: var(--surface);
                color: var(--ink);
            }
            .badge i {
                font-style: normal;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                display: inline-grid;
                place-items: center;
                font-size: 10px;
                font-weight: 800;
                color: #0b0b0b;
            }
            .badge.lvl-hypothesis i,
            .badge.lvl-assumption i {
                color: #fff;
            }
            .evbars {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                gap: 12px;
                margin: 6px 0 16px;
            }
            .evbar .bl {
                font-size: 13px;
                color: var(--ink2);
                margin-bottom: 4px;
                display: flex;
                justify-content: space-between;
                gap: 8px;
            }
            .evbar .bar {
                display: flex;
                height: 26px;
                border-radius: 6px;
                overflow: hidden;
                gap: 2px;
            }
            .evbar .bar div {
                min-width: 2px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 11.5px;
                font-weight: 650;
                white-space: nowrap;
                overflow: hidden;
            }
            .evdefs {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
                gap: 10px;
                margin: 0 0 18px;
            }
            .evdefs div {
                font-size: 13px;
                color: var(--ink2);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 9px 10px;
                background: var(--sunk);
            }
            .evdefs .badge {
                margin-bottom: 4px;
            }
            .filters {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 10px;
                align-items: center;
                padding: 12px;
                background: var(--sunk);
                border: 1px solid var(--border);
                border-radius: 12px;
                margin: 0 0 10px;
            }
            .filters input[type="search"] {
                flex: 1;
                min-width: 200px;
            }
            .rescount {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
                margin: 6px 0 8px;
                font-size: 13.5px;
                color: var(--ink2);
            }
            table {
                border-collapse: collapse;
                width: 100%;
            }
            .src-table th {
                text-align: left;
                font-size: 12px;
                font-weight: 650;
                color: var(--ink2);
                border-bottom: 1px solid var(--axis);
                padding: 8px;
                white-space: nowrap;
                position: sticky;
                top: 0;
                background: var(--surface);
                z-index: 1;
            }
            .src-table th.r {
                text-align: right;
            }
            .src-table th button {
                all: unset;
                cursor: pointer;
            }
            .src-table th button:focus-visible {
                outline: 2px solid var(--focus);
            }
            .src-table td {
                border-bottom: 1px solid var(--grid);
                padding: 9px 8px;
                vertical-align: top;
                font-size: 13.5px;
            }
            .src-table td.r {
                text-align: right;
                white-space: nowrap;
            }
            .src-table .what {
                font-weight: 550;
            }
            .src-table .st {
                font-size: 12px;
                color: var(--muted);
                margin-top: 3px;
            }
            .src-table tr.main {
                cursor: pointer;
            }
            .src-table tr.main:hover td {
                background: var(--sunk);
            }
            .src-table tr.det td {
                background: var(--sunk);
                font-size: 13px;
                color: var(--ink2);
            }
            .tscroll {
                max-height: 760px;
                overflow: auto;
                border: 1px solid var(--border);
                border-radius: 12px;
            }
            @media (max-width: 720px) {
                .src-table thead {
                    display: none;
                }
                .src-table tr.main {
                    display: grid;
                    grid-template-columns: 1fr auto;
                    gap: 2px 10px;
                    padding: 10px;
                    border-bottom: 1px solid var(--grid);
                }
                .src-table tr.main td {
                    border: 0;
                    padding: 0;
                }
                .src-table tr.main td.c-when {
                    grid-column: 1/3;
                    font-size: 12px;
                    color: var(--muted);
                }
                .src-table tr.main td.c-what {
                    grid-column: 1/3;
                }
                .src-table tr.det {
                    display: block;
                }
                .src-table tr.det td {
                    display: block;
                }
            }
            .toast {
                position: fixed;
                left: 50%;
                bottom: 24px;
                transform: translateX(-50%);
                background: var(--ink);
                color: var(--page);
                padding: 8px 14px;
                border-radius: 9px;
                font-size: 13.5px;
                display: none;
                z-index: 50;
            }
        </style>
    </head>

        <div class="wrap">

            </section>
        </div>

                return y + "-" + String(m + 1).padStart(2, "0");
            };
            const esc = s =>
                String(s ?? "").replace(
                    /[&<>"']/g,
                    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
                );
            function fmtTB(v) {
                if (v >= 1e6) return (v / 1e6).toFixed(1) + "M TB";
                if (v >= 100) return Math.round(v).toLocaleString("en-US") + " TB";
                if (v >= 10) return v.toFixed(0) + " TB";
                if (v >= 1) return v.toFixed(1) + " TB";
                if (v > 0) return v.toPrecision(2) + " TB";
                return "0 TB";
            }
            const pct = (v, d = 0) => (v * 100).toFixed(d) + "%";
            const clean = s => {
                s = s.replace(/\s*\((hyp\.|alleged|assumption|leak)\)\s*$/i, "").trim();
                return s[0].toUpperCase() + s.slice(1);
            };
            const host = u => {
                try {
                    return new URL(u).hostname.replace(/^www\./, "");
                } catch (e) {
                    return "";
                }
            };
            function toast(t) {
                const n = $("#toast");
                n.textContent = t;
                n.style.display = "block";
                clearTimeout(toast.h);
                toast.h = setTimeout(() => (n.style.display = "none"), 2200);
            }

            const LV = [
                {
                    k: "confirmed",
                    name: "Confirmed",
                    g: "✓",
                    def: "Stated by the lab itself, in a paper or model card, or established in a court record."
                },
                {
                    k: "reported",
                    name: "Reported",
                    g: "R",
                    def: "Credible press reporting, leaks or admissions, or a published policy that allows it. Usually not denied."
                },
                {
                    k: "alleged",
                    name: "Alleged",
                    g: "!",
                    def: "Claimed in a lawsuit or complaint. Disputed by the company; not proven."
                },
                {
                    k: "assumption",
                    name: "Assumption",
                    g: "≈",
                    def: "A modelled flow (labs × crawl snapshots, users × prompts…). The activity is documented; the volume is this model's estimate."
                },
                {
                    k: "hypothesis",
                    name: "Hypothesis",
                    g: "?",
                    def: "Not shown, and sometimes contradicting stated policy. Included only because this is a theoretical upper bound."
                }
            ];
            const LVI = Object.fromEntries(LV.map((l, i) => [l.k, i]));
            const badge = k => {
                const l = LV[LVI[k]];
                return `<span class="badge lvl-${k}"><i style="background:var(--ev-${k})">${l.g}</i>${l.name}</span>`;
            };
            const GROUPS = D.groups;

            D.events.forEach((e, i) => {
                e.id = i;
                e.lv = e.tag === "policy" ? "reported" : e.tag;
                e.first = 999;
                e.last = -1;
                e.tb = 0;
                e.utb = 0;
                e.n = new Set();
                e.group = D.categories[e.cat].group;
                e.title = clean(e.short);
            });
            for (const [mi, ei, tb] of D.inflow) {
                const e = D.events[ei],
                    c = D.categories[e.cat];
                e.first = Math.min(e.first, mi);
                e.last = Math.max(e.last, mi);
                e.tb += tb;
                e.utb += tb * c.useful;
                e.n.add(mi);
            }
            const whenTxt = e =>
                e.first === e.last ? mlabel(e.first) : mlabel(e.first) + " – " + (e.last === LAST ? "ongoing" : mlabel(e.last));

            const S = {
                q: "",
                evf: new Set(LV.map(l => l.k)),
                actor: "",
                group: "",
                kind: "",
                sort: "first",
                dir: 1,
                open: new Set()
            };
            function initFilters() {
                $("#evfilter").innerHTML = LV.map(
                    l =>
                        `<button class="chip" data-evf="${l.k}" aria-pressed="true"><span class="sw" style="background:var(--ev-${l.k})"></span>${l.name}</button>`
                ).join("");
                $$("[data-evf]").forEach(
                    b =>
                        (b.onclick = () => {
                            const k = b.dataset.evf;
                            S.evf.has(k) ? S.evf.delete(k) : S.evf.add(k);
                            b.setAttribute("aria-pressed", S.evf.has(k));
                            render();
                        })
                );
                const actors = [...new Set(D.events.map(e => e.actor))].sort((a, b) => a.localeCompare(b));
                $("#f-actor").innerHTML =
                    `<option value="">All actors (${actors.length})</option>` +
                    actors.map(a => `<option>${esc(a)}</option>`).join("");
                $("#f-group").innerHTML =
                    `<option value="">All data types</option>` +
                    GROUPS.map((g, k) => `<option value="${k}">${esc(g)}</option>`).join("");
                $("#q").oninput = e => {
                    S.q = e.target.value.toLowerCase();
                    render();
                };
                $("#f-actor").onchange = e => {
                    S.actor = e.target.value;
                    render();
                };
                $("#f-group").onchange = e => {
                    S.group = e.target.value;
                    render();
                };
                $("#f-kind").onchange = e => {
                    S.kind = e.target.value;
                    render();
                };
                $$("[data-sort]").forEach(
                    b =>
                        (b.onclick = () => {
                            const k = b.dataset.sort;
                            if (S.sort === k) S.dir *= -1;
                            else {
                                S.sort = k;
                                S.dir = k === "tb" || k === "utb" ? -1 : 1;
                            }
                            render();
                        })
                );
                $("#copylinks").onclick = copyLinks;
                $("#dlsrc").onclick = dlSources;
            }
            function filtered() {
                const q = S.q;
                const L = D.events.filter(
                    e =>
                        S.evf.has(e.lv) &&
                        (!S.actor || e.actor === S.actor) &&
                        (S.group === "" || e.group === +S.group) &&
                        (!S.kind || e.kind === S.kind) &&
                        (!q ||
                            (
                                e.actor +
                                " " +
                                e.what +
                                " " +
                                e.short +
                                " " +
                                e.src +
                                " " +
                                e.status +
                                " " +
                                e.url +
                                " " +
                                D.categories[e.cat].name
                            )
                                .toLowerCase()
                                .includes(q))
                );
                const k = S.sort;
                return L.sort(
                    (a, b) => (k === "actor" ? a.actor.localeCompare(b.actor) : a[k] - b[k]) * S.dir || a.first - b.first
                );
            }
            function render() {
                const L = filtered(),
                    tb = $("#src-table tbody");
                $$("[data-sort]").forEach(
                    b =>
                        (b.textContent =
                            b.textContent.replace(/ [▲▼]$/, "") + (b.dataset.sort === S.sort ? (S.dir > 0 ? " ▲" : " ▼") : ""))
                );
                const links = new Set(L.filter(e => e.url).map(e => e.url)).size;
                $("#rescount").textContent =
                    `${L.length} of ${D.events.length} rows · ${links} distinct links · ${fmtTB(L.reduce((a, e) => a + e.tb, 0))} raw`;
                tb.innerHTML = L.map(e => {
                    const c = D.categories[e.cat];
                    const kind =
                        e.kind === "event"
                            ? "one-off"
                            : e.kind === "spread"
                              ? "spread over months"
                              : e.kind === "flow"
                                ? "ongoing flow"
                                : "backfill";
                    const main = `<tr class="main" data-id="${e.id}" tabindex="0" aria-expanded="${S.open.has(e.id)}">
      <td class="c-when" style="white-space:nowrap">${whenTxt(e)}</td><td>${esc(e.actor)}</td>
      <td class="c-what"><div class="what">${esc(e.what)}</div><div class="st">${esc(c.name)} · ${kind}</div></td>
      <td>${badge(e.lv)}<div class="st">${esc(e.status)}</div></td><td class="r">${fmtTB(e.tb)}</td><td class="r">${fmtTB(e.utb)}</td>
      <td>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(e.src)}</a><div class="st">${esc(host(e.url))}</div>` : `<span class="st">${esc(e.src || "no link")}</span>`}</td></tr>`;
                    const det = S.open.has(e.id)
                        ? `<tr class="det"><td colspan="7"><b>${esc(c.name)}</b>: ${pct(c.useful, c.useful < 0.01 ? 1 : 0)} counted as useful. ${esc(c.why)}<br>
      Machine-written share in this category: ${pct(c.llm[0])} (2018) → ${pct(c.llm[8])} (2026) · pool: ${c.pool >= 0 ? esc(D.pools[c.pool].name) : "machine-made, no ceiling"} · active ${e.n.size} month${e.n.size > 1 ? "s" : ""}</td></tr>`
                        : "";
                    return main + det;
                }).join("");
                tb.querySelectorAll("tr.main").forEach(r => {
                    const f = () => {
                        const id = +r.dataset.id;
                        S.open.has(id) ? S.open.delete(id) : S.open.add(id);
                        render();
                    };
                    r.onclick = f;
                    r.onkeydown = ev => {
                        if (ev.key === "Enter" || ev.key === " ") {
                            ev.preventDefault();
                            f();
                        }
                    };
                });
            }
            async function copyLinks() {
                const seen = new Set(),
                    out = [];
                for (const e of filtered()
                    .slice()
                    .sort((a, b) => a.first - b.first)) {
                    if (!e.url || seen.has(e.url)) continue;
                    seen.add(e.url);
                    out.push(`${mkey(e.first)} ${e.actor}, ${e.title} (${e.src}): ${e.url}`);
                }
                const txt = out.join("\n");
                try {
                    await navigator.clipboard.writeText(txt);
                } catch (err) {
                    const t = document.createElement("textarea");
                    t.value = txt;
                    document.body.appendChild(t);
                    t.select();
                    document.execCommand("copy");
                    t.remove();
                }
                toast(`Copied ${out.length} links`);
            }
            function dlSources() {
                const rows = [
                    [
                        "First month",
                        "Last month",
                        "Actor",
                        "What entered",
                        "Evidence",
                        "Status",
                        "Category",
                        "Raw TB",
                        "Useful TB",
                        "Source",
                        "URL"
                    ],
                    ...filtered().map(e => [
                        mkey(e.first),
                        mkey(e.last),
                        e.actor,
                        e.what,
                        LV[LVI[e.lv]].name,
                        e.status,
                        D.categories[e.cat].name,
                        e.tb.toFixed(3),
                        e.utb.toFixed(3),
                        e.src,
                        e.url
                    ])
                ];
                const csv = rows
                    .map(r =>
                        r
                            .map(v => {
                                v = String(v ?? "");
                                return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
                            })
                            .join(",")
                    )
                    .join("\n");
                const a = document.createElement("a");
                a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
                a.download = "ai_training_data_sources.csv";
                document.body.appendChild(a);
                a.click();
                a.remove();
            }
            initFilters();
            render();
        </script>
    </body>
</html>
